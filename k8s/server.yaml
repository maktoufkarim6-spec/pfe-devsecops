apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: app-cobaye-server:latest
          imagePullPolicy: Never
          command: ["./wait-for-it.sh", "postgres-db:5432", "--", "node", "main.js"]
          env:
            - name: SECRET
              value: "changeme"
          ports:
            - containerPort: 5500
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - port: 5500
      targetPort: 5500
