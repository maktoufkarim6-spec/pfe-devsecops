# Déploiement de la supervision multi-nœuds. Lancé par ../deploy.sh depuis le serveur de supervision.
# 1) supervision centrale  2) collecteurs, compte de l'agent et sauvegardes sur chaque nœud
# 3) agent de remédiation (une fois les nœuds prêts à le recevoir)

- name: Catalogue des applications (applications/<nom>/values.yaml), partagé par tous les rôles
  hosts: all
  gather_facts: false
  tasks:
    - name: Lecture du dépôt
      ansible.builtin.include_role:
        name: applications
        tasks_from: catalogue
      tags: [always]

- name: Fenêtre de maintenance pendant le déploiement (pas de fausse anomalie, pas d'action de l'agent)
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Dossier des annonces de maintenance
      ansible.builtin.file:
        path: "{{ textfile_dir }}"
        state: directory
        mode: "0755"

    - name: Annonce de 20 min (sans raccourcir une annonce plus longue, ex. un build Jenkins)
      ansible.builtin.shell: |
        f={{ textfile_dir }}/maintenance.prom
        fin=$(( $(date +%s) + 1200 ))
        actuel=$(awk '$1=="pfe_maintenance_until_seconds"{print int($2)}' "$f" 2>/dev/null || true)
        if [ -z "$actuel" ] || [ "$actuel" -lt "$fin" ]; then
          echo "pfe_maintenance_until_seconds $fin" > "$f.tmp" && chmod 0644 "$f.tmp" && mv -f "$f.tmp" "$f"
        fi
      changed_when: false

- name: Docker sur tous les serveurs
  hosts: all
  become: true
  roles: [docker]

- name: Nœud de contrôle d'un PARC NEUF (k3s serveur, Argo CD, chaîne CI) ; jamais sur un nœud de contrôle existant
  hosts: nodes
  become: true
  tasks:
    - name: k3s déjà actif sur le nœud de contrôle ?
      ansible.builtin.command: systemctl is-active --quiet k3s
      register: parc_k3s_actif
      changed_when: false
      failed_when: false
      when: inventory_hostname == k3s_server_host

    - name: Nœud de contrôle existant
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} : k3s déjà installé, nœud de contrôle existant non modifié (Jenkins, Argo CD conservés tels quels)."
      when: inventory_hostname == k3s_server_host and parc_k3s_actif.rc == 0

    - name: Installation complète du nœud de contrôle (serveur vide seulement)
      when: inventory_hostname == k3s_server_host and parc_k3s_actif.rc != 0
      block:
        - name: Sonde du serveur (lecture seule)
          ansible.builtin.include_role:
            name: k3s_noeud
            tasks_from: sonde
        - name: Serveur vide et compatible, sinon rien n'est installé
          ansible.builtin.include_role:
            name: k3s_noeud
            tasks_from: verifier_vide
        - name: Serveur k3s
          ansible.builtin.include_role:
            name: k3s_controle
        - name: Argo CD et application cobaye
          ansible.builtin.include_role:
            name: argocd
        - name: Chaîne CI (SonarQube, Vault, Jenkins)
          ansible.builtin.include_role:
            name: ci

- name: Nouveaux nœuds applicatifs -> cluster k3s (serveur vide seulement, voir docs/PARC.md)
  hosts: nodes
  become: true
  tasks:
    - name: Rejoindre le cluster du nœud de contrôle (rien à faire sur un nœud déjà agent k3s)
      ansible.builtin.include_role:
        name: k3s_noeud
      when: node_app | bool and inventory_hostname != k3s_server_host

- name: Serveur de supervision
  hosts: monitoring
  become: true
  tasks:
    - name: Identité de l'agent de remédiation (clé SSH et jeton du webhook, avant Alertmanager)
      ansible.builtin.import_role:
        name: remediation
        tasks_from: keys

    - name: Prometheus, Alertmanager, Grafana et moteur AIOps
      ansible.builtin.import_role:
        name: monitoring
      # Mise à jour de la seule supervision (sans mot de passe, depuis le serveur de supervision) :
      #   ansible-playbook site.yml --limit supervision --tags supervision
      tags: [supervision]

- name: Collecteurs, accès de l'agent et sauvegardes sur chaque nœud
  hosts: all
  become: true
  roles: [exporters, backup]
  tasks:
    - name: Compte pfe-agent et liste fermée des actions autorisées
      ansible.builtin.import_role:
        name: remediation
        tasks_from: node

- name: Étiquette pfe.noeud sur chaque nœud k3s (choix des nœuds au déploiement, paramètre NOEUDS de Jenkins)
  hosts: nodes
  become: true
  tasks:
    - name: Étiquette posée depuis le nœud de contrôle (nom k3s du nœud = son nom d'hôte)
      ansible.builtin.command: >-
        k3s kubectl label node {{ ansible_nodename | lower }} pfe.noeud={{ node_name }} --overwrite
      delegate_to: "{{ k3s_server_host }}"
      when: node_app | bool
      register: etiquette
      changed_when: "'labeled' in etiquette.stdout and 'not labeled' not in etiquette.stdout"
      # Un nœud absent du cluster k3s ne bloque pas le reste du déploiement
      failed_when: false

    - name: Nœud introuvable dans k3s
      ansible.builtin.debug:
        msg: "{{ node_name }} : étiquette non posée ({{ etiquette.stderr | default('') }})"
      when: node_app | bool and etiquette.rc | default(0) != 0

- name: Applications de la plateforme (dossiers applications/<nom>/, voir docs/APPLICATIONS.md)
  hosts: nodes
  become: true
  gather_facts: false
  tasks:
    - name: Namespaces, secrets et ApplicationSet Argo CD (nœud de contrôle seulement)
      ansible.builtin.include_role:
        name: applications
      when: inventory_hostname == k3s_server_host
      tags: [applications]

    - name: État des déploiements pour Grafana (versions, Argo CD), chaque minute
      ansible.builtin.include_role:
        name: applications
        tasks_from: etat_cluster
      when: inventory_hostname == k3s_server_host
      tags: [applications]

- name: Agent de remédiation
  hosts: monitoring
  become: true
  tasks:
    - name: Conteneur de l'agent
      ansible.builtin.import_role:
        name: remediation
        tasks_from: agent
