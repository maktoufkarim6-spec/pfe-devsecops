# Argo CD d'un PARC NEUF, puis l'application cobaye (dossier k8s/). Les autres applications (applications/<nom>/)
# sont ensuite déployées par l'ApplicationSet du rôle applications.

- name: Namespace argocd
  ansible.builtin.shell: |
    set -e
    k3s kubectl create namespace argocd --dry-run=client -o yaml | k3s kubectl apply -f - >/dev/null
  changed_when: false

- name: Manifeste officiel d'Argo CD, figé sur la version choisie
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ parc_argocd_version }}/manifests/install.yaml"
    dest: /usr/local/lib/pfe/argocd-install.yaml
    mode: "0644"

# --server-side : la définition ApplicationSet (1,4 Mo) dépasse ce qu'accepte kubectl apply côté client (cas vécu :
# Argo CD du premier parc installé sans elle, contrôleur en erreur pendant 43 jours)
- name: Installation d'Argo CD (côté serveur)
  ansible.builtin.command: >-
    k3s kubectl apply --server-side --force-conflicts -n argocd -f /usr/local/lib/pfe/argocd-install.yaml
  register: argocd_apply
  changed_when: "'serverside-applied' in argocd_apply.stdout and 'unchanged' not in argocd_apply.stdout"

- name: Composants d'Argo CD prêts
  ansible.builtin.command: k3s kubectl -n argocd rollout status {{ item }} --timeout=300s
  loop:
    - deployment/argocd-server
    - deployment/argocd-repo-server
    - deployment/argocd-applicationset-controller
    - statefulset/argocd-application-controller
  changed_when: false

- name: Interface d'Argo CD sur le port 32252 (même adresse que le premier parc)
  ansible.builtin.command: >-
    k3s kubectl -n argocd patch service argocd-server --type merge
    -p '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":8080},{"name":"https","port":443,"targetPort":8080,"nodePort":32252}]}}'
  register: argocd_port
  changed_when: "'no change' not in argocd_port.stdout"

- name: Secret de l'application cobaye déjà présent ?
  ansible.builtin.command: k3s kubectl -n {{ app_namespace }} get secret app-cobaye-secrets -o name
  register: argocd_secret
  changed_when: false
  failed_when: argocd_secret.rc != 0 and 'NotFound' not in argocd_secret.stderr

- name: Secret de l'application cobaye (créé une fois, jamais régénéré ; valeurs jamais affichées)
  ansible.builtin.command:
    cmd: k3s kubectl create -f -
    stdin: "{{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
                'metadata': {'name': 'app-cobaye-secrets', 'namespace': app_namespace},
                'stringData': {'postgres-user': 'cobaye',
                               'postgres-password': lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']),
                               'jwt-secret': lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits'])}} | to_json }}"
  when: argocd_secret.rc != 0
  no_log: true

- name: Application Argo CD de l'application cobaye (dossier k8s/ du dépôt)
  ansible.builtin.template:
    src: app-cobaye.yaml.j2
    dest: /usr/local/lib/pfe/app-cobaye.yaml
    mode: "0644"

- name: Application cobaye déclarée
  ansible.builtin.command: k3s kubectl apply -f /usr/local/lib/pfe/app-cobaye.yaml
  register: argocd_app
  changed_when: "'unchanged' not in argocd_app.stdout"

- name: Mot de passe admin d'Argo CD
  ansible.builtin.debug:
    msg: >-
      Argo CD : https://{{ ansible_host }}:32252/ (utilisateur admin). Mot de passe initial, sur ce nœud :
      sudo k3s kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
