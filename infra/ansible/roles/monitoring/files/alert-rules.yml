# Règles d'alerte du parc (toutes par nœud). Fichier statique : les {{ }} sont des modèles Prometheus.
groups:
  - name: infrastructure
    rules:
      - alert: NoeudInjoignable
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nœud {{ $labels.node }} injoignable"
          description: "Prometheus ne parvient plus à lire node-exporter sur {{ $labels.node }} depuis 2 minutes (serveur arrêté, réseau ou pare-feu)."

      - alert: CpuEleve
        expr: 100 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU à {{ $value | printf \"%.0f\" }} % sur {{ $labels.node }}"

      - alert: RamElevee
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RAM à {{ $value | printf \"%.0f\" }} % sur {{ $labels.node }}"

      - alert: DisquePlein
        expr: 100 - node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{mountpoint="/",fstype="ext4"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disque à {{ $value | printf \"%.0f\" }} % sur {{ $labels.node }}"

  - name: aiops
    rules:
      # Nœuds seulement : les applications de la plateforme ont leur propre alerte (AnomalieApplication)
      - alert: AnomalieAIOps
        expr: aiops_anomaly_active == 1 unless on (node) aiops_target_info{kind="application"}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Anomalie détectée par le moteur AIOps sur {{ $labels.node }}"
          description: >-
            Variable la plus déviante :
            {{ with printf "max by (feature) (aiops_top_feature{node=\"%s\"} == 1)" $labels.node | query }}{{ range . }}{{ .Labels.feature }}{{ end }}{{ end }}
            (z = {{ with printf "aiops_top_feature_zscore{node=\"%s\"}" $labels.node | query }}{{ . | first | value | printf "%.1f" }}{{ end }}).

      # Application de la plateforme (cible appli-<nom>) : l'étiquette application dit laquelle
      - alert: AnomalieApplication
        expr: (aiops_anomaly_active == 1) * on (node) group_left (application) aiops_target_info{kind="application"}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Anomalie détectée par le moteur AIOps sur l'application {{ $labels.application }}"
          description: >-
            Variable la plus déviante :
            {{ with printf "max by (feature) (aiops_top_feature{node=\"%s\"} == 1)" $labels.node | query }}{{ range . }}{{ .Labels.feature }}{{ end }}{{ end }}
            (z = {{ with printf "aiops_top_feature_zscore{node=\"%s\"}" $labels.node | query }}{{ . | first | value | printf "%.1f" }}{{ end }}).

      - alert: DisquePleinPrevu
        expr: aiops_forecast_hours_to_saturation{resource="disk"} < 24 and on (node) aiops_forecast_reliable{resource="disk"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disque plein prévu dans {{ $value | printf \"%.0f\" }} h sur {{ $labels.node }} (tendance Theil-Sen fiable)"

      - alert: AIOpsAveugle
        expr: aiops_data_quality == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Le moteur AIOps ne reçoit plus de données fiables pour {{ $labels.node }}"

      - alert: MoteurAIOpsArrete
        expr: up{job="aiops-engine"} == 0 or absent(up{job="aiops-engine"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Le moteur AIOps ne répond plus : aucune détection d'anomalie en cours"

  - name: services
    rules:
      - alert: ServiceInjoignable
        expr: probe_success{job="services",hors_build="non"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} ne répond plus depuis 3 minutes ({{ $labels.instance }})"

  - name: applications
    rules:
      # Adresse web de chaque application (applications/<nom>/), testée toutes les 15 s depuis la supervision
      - alert: ApplicationHorsLigne
        expr: probe_success{job="applications"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "L'application {{ $labels.application }} ne répond plus depuis 2 minutes ({{ $labels.instance }})"
          description: >-
            Argo CD remet les pods manquants seul (self-heal). Si l'alerte dure : Argo CD (état de app-{{ $labels.application }}),
            puis k3s kubectl -n {{ $labels.application }} get pods sur le nœud de contrôle.

  - name: parc
    rules:
      # Découverte horaire des adresses de infra/parc.yml (lecture seule) : un serveur vide attend d'être ajouté
      - alert: ServeurVideDetecte
        expr: pfe_parc_serveur{etat="vide",inventaire=""} == 1
        labels:
          severity: info
          source: parc
        annotations:
          summary: "Serveur vide disponible : {{ $labels.adresse }}"
          description: "Proposé comme nouveau nœud applicatif. Sur le serveur de supervision : bash deploy.sh --ajouter {{ $labels.adresse }}"
      - alert: DecouverteParcEnRetard
        # Date du fichier écrit par la découverte (une métrique de fichier texte, elle, paraît toujours fraîche)
        expr: >-
          time() - node_textfile_mtime_seconds{file=~".*pfe_parc.prom"} > 3 * 3600
          or absent(node_textfile_mtime_seconds{file=~".*pfe_parc.prom"})
        for: 30m
        labels:
          severity: warning
          source: parc
        annotations:
          summary: "La découverte du parc ne s'est pas exécutée depuis plus de 3 h"
          description: "journalctl -u pfe-parc sur le serveur de supervision."

  - name: synchronisation
    rules:
      # pfe-sync rejoue le déploiement quand les applications changent dans GitHub (toutes les 5 min)
      - alert: SynchronisationEchouee
        expr: pfe_sync_statut == 0
        for: 15m
        labels:
          severity: warning
          source: parc
        annotations:
          summary: "La resynchronisation automatique des applications échoue depuis 15 minutes"
          description: "Une application ajoutée dans GitHub n'est pas encore supervisée ni sauvegardée. Journal : ~/.pfe-parc/sync.log sur le serveur de supervision."

  - name: collecteurs
    rules:
      - alert: CollecteurArrete
        expr: up{job=~"cadvisor|cadvisor-k3s"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Collecteur {{ $labels.job }} muet sur {{ $labels.node }} depuis 2 minutes"

  # Alertes sur l'agent et les sauvegardes : source=agent|backup, l'agent n'agit jamais sur elles.
  - name: agent
    rules:
      - alert: ActionAutomatique
        expr: time() - pfe_agent_last_action_timestamp_seconds{outcome!="simulee"} < 900
        labels:
          severity: warning
          source: agent
        annotations:
          summary: "L'agent a exécuté « {{ $labels.action }} » sur {{ $labels.node }} : {{ $labels.outcome }}"
          description: "Détail et vérification 5 min après : docker exec mon-remediation python -m agent journal"

      - alert: ActionAutomatiqueSansEffet
        expr: increase(pfe_agent_verifications_total{result="persistant"}[15m]) > 0
        labels:
          severity: warning
          source: agent
        annotations:
          summary: "L'action « {{ $labels.action }} » de l'agent n'a pas fait disparaître l'alerte : intervention humaine"

      - alert: AgentRemediationArrete
        expr: up{job="remediation-agent"} == 0 or absent(up{job="remediation-agent"})
        for: 3m
        labels:
          severity: critical
          source: agent
        annotations:
          summary: "L'agent de remédiation ne répond plus : plus aucune réparation automatique"

      - alert: AgentRemediationSuspendu
        expr: pfe_agent_suspended == 1
        labels:
          severity: critical
          source: agent
        annotations:
          summary: "L'agent s'est suspendu après des échecs répétés (journal : docker exec mon-remediation python -m agent journal)"

      - alert: AgentNoeudInaccessible
        expr: pfe_agent_node_reachable == 0
        for: 10m
        labels:
          severity: warning
          source: agent
        annotations:
          summary: "L'agent ne peut plus joindre {{ $labels.node }} en SSH : aucune réparation possible sur ce nœud"

  - name: sauvegardes
    rules:
      - alert: SauvegardeEchouee
        expr: pfe_backup_last_status == 0
        labels:
          severity: warning
          source: backup
        annotations:
          summary: "La dernière sauvegarde de {{ $labels.node }} a échoué (journalctl -u pfe-backup)"

      - alert: SauvegardeEnRetard
        expr: pfe_backup_last_success_timestamp_seconds > 0 and time() - pfe_backup_last_success_timestamp_seconds > 26 * 3600
        for: 30m
        labels:
          severity: warning
          source: backup
        annotations:
          summary: "Aucune sauvegarde réussie de {{ $labels.node }} depuis plus de 26 h"

      - alert: CopieDistanteEnRetard
        expr: pfe_backup_offsite_last_success_timestamp_seconds > 0 and time() - pfe_backup_offsite_last_success_timestamp_seconds > 26 * 3600
        for: 30m
        labels:
          severity: warning
          source: backup
        annotations:
          summary: "Les sauvegardes de {{ $labels.node }} ne sont plus copiées sur l'autre serveur depuis 26 h"

      - alert: SauvegardeJamaisReussie
        expr: pfe_backup_last_success_timestamp_seconds == 0 or pfe_backup_offsite_last_success_timestamp_seconds == 0
        for: 30h
        labels:
          severity: warning
          source: backup
        annotations:
          summary: "Aucune sauvegarde complète (locale et copie distante) de {{ $labels.node }} depuis son installation"

      - alert: SauvegardeRecueCorrompue
        expr: pfe_backup_received_valid == 0
        labels:
          severity: critical
          source: backup
        annotations:
          summary: "Le dernier jeu reçu de {{ $labels.source }} sur {{ $labels.node }} a des empreintes incorrectes"

      - alert: SauvegardeApplicationEchouee
        expr: pfe_backup_app_status == 0
        labels:
          severity: warning
          source: backup
        annotations:
          summary: "La base de l'application {{ $labels.application }} n'a pas été sauvegardée cette nuit"
          description: "Les autres bases sont sauvegardées. Journal : journalctl -t pfe-backup sur {{ $labels.node }}."

      - alert: TestRestaurationEchoue
        expr: pfe_backup_restore_test_status == 0
        labels:
          severity: critical
          source: backup
        annotations:
          summary: "Le test de restauration de {{ $labels.node }} a échoué : les sauvegardes ne sont peut-être pas utilisables"

      - alert: TestRestaurationEnRetard
        expr: pfe_backup_restore_test_last_success_timestamp_seconds > 0 and time() - pfe_backup_restore_test_last_success_timestamp_seconds > 8 * 86400
        labels:
          severity: warning
          source: backup
        annotations:
          summary: "Aucun test de restauration réussi sur {{ $labels.node }} depuis 8 jours"
