# Plusieurs applications sur le cluster (docs/APPLICATIONS.md). Exécuté sur le nœud de contrôle k3s.
# 1) contrôle des dossiers applications/<nom>/   2) namespace et secrets de chaque application
# 3) ApplicationSet Argo CD : une Application par dossier, déployée avec le chart plateforme/chart.
# L'application cobaye (k8s/, namespace default) n'est pas concernée : elle reste gérée comme avant.

- name: Catalogue des applications (déjà lu en tête de site.yml, relu si le rôle est lancé seul)
  ansible.builtin.include_tasks: catalogue.yml
  when: plateforme_catalogue is not defined

- name: Liste des applications
  ansible.builtin.set_fact:
    plateforme_apps: "{{ plateforme_catalogue | map(attribute='nom') | list }}"

- name: Noms valides (minuscules, chiffres, tirets ; pas de nom réservé)
  ansible.builtin.assert:
    that:
      - item is match('^[a-z][a-z0-9-]{1,30}[a-z0-9]$')
      - item not in ['default', 'kube-system', 'kube-public', 'kube-node-lease', 'argocd', 'plateforme']
    fail_msg: "applications/{{ item }} : nom invalide ou réservé"
    quiet: true
  loop: "{{ plateforme_apps }}"

- name: Version d'Argo CD installée
  ansible.builtin.command: >-
    k3s kubectl -n argocd get deployment argocd-server
    -o jsonpath={.spec.template.spec.containers[0].image}
  register: plateforme_argocd
  changed_when: false
  failed_when: false

- name: Définition ApplicationSet présente ?
  ansible.builtin.command: k3s kubectl get crd applicationsets.argoproj.io
  register: plateforme_crd
  changed_when: false
  failed_when: false

# Cas connu : « kubectl apply » (côté client) de l'installation d'Argo CD saute cette définition, trop grande
# pour ses annotations. Le contrôleur ApplicationSet redémarre alors en boucle. On l'installe côté serveur,
# dans la version exacte d'Argo CD (source officielle).
- name: Installation de la définition ApplicationSet (version d'Argo CD, côté serveur)
  ansible.builtin.command: >-
    k3s kubectl apply --server-side --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ plateforme_argocd.stdout.split(':')[-1] }}/manifests/crds/applicationset-crd.yaml
  when:
    - plateforme_crd.rc != 0
    - plateforme_argocd.rc == 0
    - plateforme_argocd.stdout is match('.*argocd:v[0-9]+\.[0-9]+\.[0-9]+$')
  register: plateforme_crd_install

- name: Contrôleur ApplicationSet relancé (sans attendre la fin de son attente entre deux redémarrages)
  ansible.builtin.command: k3s kubectl -n argocd rollout restart deployment argocd-applicationset-controller
  when: plateforme_crd_install is changed

- name: Contrôleur ApplicationSet opérationnel
  ansible.builtin.command: k3s kubectl -n argocd rollout status deployment argocd-applicationset-controller --timeout=180s
  when: plateforme_crd_install is changed
  changed_when: false

- name: Définition ApplicationSet (après installation éventuelle)
  ansible.builtin.command: k3s kubectl get crd applicationsets.argoproj.io
  register: plateforme_crd
  changed_when: false
  failed_when: false

- name: Argo CD sans ApplicationSet
  ansible.builtin.debug:
    msg: >-
      ApplicationSet absent (Argo CD trop ancien ou installé sans son contrôleur) : applications
      supplémentaires NON déployées. L'application cobaye n'est pas touchée.
  when: plateforme_crd.rc != 0

# Aussi utilisé par l'application cobaye, Jenkins et Argo CD (rôle https) : installé même sans ApplicationSet
- name: HTTPS (cert-manager et Let's Encrypt), si activé
  when: https_actif | bool
  block:
    - name: Dossier de travail
      ansible.builtin.file:
        path: "{{ plateforme_dossier }}"
        state: directory
        mode: "0700"

    - name: cert-manager et émetteurs Let's Encrypt
      ansible.builtin.include_tasks: https.yml

- name: Namespace, secrets et ApplicationSet
  when: plateforme_crd.rc == 0
  block:
    - name: Namespace de chaque application (étiqueté pour l'isolement réseau)
      ansible.builtin.shell: |
        set -e
        k3s kubectl create namespace {{ item }} --dry-run=client -o yaml \
          | k3s kubectl apply -f - >/dev/null
        k3s kubectl label namespace {{ item }} pfe.plateforme=application --overwrite >/dev/null
      loop: "{{ plateforme_apps }}"
      changed_when: false

    - name: Secrets de chaque application (clés manquantes générées, clés existantes jamais modifiées)
      ansible.builtin.include_tasks: secrets.yml
      loop: "{{ plateforme_apps }}"
      loop_control:
        loop_var: app

    - name: Dossier de travail
      ansible.builtin.file:
        path: "{{ plateforme_dossier }}"
        state: directory
        mode: "0700"

    - name: ApplicationSet (une Application Argo CD par dossier applications/<nom>/)
      ansible.builtin.template:
        src: applicationset.yaml.j2
        dest: "{{ plateforme_dossier }}/applicationset.yaml"
        mode: "0600"
      register: plateforme_appset

    - name: ApplicationSet appliqué
      ansible.builtin.command: k3s kubectl apply -f {{ plateforme_dossier }}/applicationset.yaml
      register: plateforme_apply
      changed_when: "'unchanged' not in plateforme_apply.stdout"

    - name: Applications de la plateforme
      ansible.builtin.debug:
        msg: >-
          {{ plateforme_apps | length }} application(s) : {{ plateforme_apps | join(', ') }}.
          Adresses : http://<nom>.{{ app_ip | replace('.', '-') }}.sslip.io/ (sauf domaine choisi).
