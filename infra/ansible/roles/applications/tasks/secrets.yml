# Secret <app>-secrets : identifiants de la base (si base.active) et clés de secrets_generes.
# Une clé déjà présente n'est jamais régénérée (sinon la base deviendrait inaccessible).

- name: "{{ app }} : configuration"
  ansible.builtin.set_fact:
    app_conf: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../applications/' + app + '/values.yaml') | from_yaml | default({}, true) }}"

- name: "{{ app }} : clés attendues"
  ansible.builtin.set_fact:
    app_cles: >-
      {{ (['postgres-user', 'postgres-password'] if (app_conf.base | default({})).active | default(false) else [])
         + (app_conf.secrets_generes | default([])) }}

- name: "{{ app }} : clés déjà présentes"
  ansible.builtin.command: >-
    k3s kubectl get secret {{ app }}-secrets -n {{ app }} -o go-template='{{ '{{' }}range $k, $v := .data{{ '}}' }}{{ '{{' }}$k{{ '}}' }} {{ '{{' }}end{{ '}}' }}'
  register: app_existant
  changed_when: false
  failed_when: app_existant.rc != 0 and 'NotFound' not in app_existant.stderr

- name: "{{ app }} : aucune clé manquante pour l'instant"
  ansible.builtin.set_fact:
    app_manquantes: {}

- name: "{{ app }} : valeur de chaque clé manquante (utilisateur = nom de l'application, le reste aléatoire)"
  ansible.builtin.set_fact:
    app_manquantes: >-
      {{ app_manquantes | combine({item: (app if item == 'postgres-user' else
           lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']))}) }}
  loop: "{{ app_cles | difference(app_existant.stdout.split()) }}"
  no_log: true

- name: "{{ app }} : création du Secret"
  ansible.builtin.command:
    cmd: k3s kubectl create -f -
    stdin: "{{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
                'metadata': {'name': app + '-secrets', 'namespace': app,
                             'labels': {'app.kubernetes.io/managed-by': 'plateforme-pfe'}},
                'stringData': app_manquantes} | to_json }}"
  when: app_existant.rc != 0
  no_log: true

- name: "{{ app }} : ajout des clés manquantes (les autres restent intactes)"
  ansible.builtin.command:
    cmd: k3s kubectl patch secret {{ app }}-secrets -n {{ app }} --type merge --patch-file /dev/stdin
    stdin: "{{ {'stringData': app_manquantes} | to_json }}"
  when: app_existant.rc == 0 and app_manquantes | length > 0
  no_log: true

- name: "{{ app }} : clés ajoutées"
  ansible.builtin.debug:
    msg: "{{ app }}-secrets : {{ (app_manquantes.keys() | list | join(', ')) or 'rien à ajouter' }}"
