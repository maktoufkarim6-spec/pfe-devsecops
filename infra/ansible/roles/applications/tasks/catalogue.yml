# Catalogue des applications de la plateforme, lu une fois dans le dépôt (applications/<nom>/values.yaml)
# et partagé par la supervision, l'IA, l'agent et les sauvegardes (plateforme_catalogue).
# Chaque entrée : nom, composants (tous), redemarrables (hors base), base (bool), nom_base, url (adresse testée,
# en https quand le HTTPS est activé et que l'application a un domaine).

- name: Fichiers des applications (un dossier applications/<nom>/ avec son values.yaml)
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../../applications"
    patterns: values.yaml
    recurse: true
    depth: 2
  delegate_to: localhost
  become: false
  run_once: true
  register: plateforme_fichiers

- name: Catalogue des applications
  ansible.builtin.set_fact:
    plateforme_catalogue: "{{ plateforme_catalogue_brut | from_yaml | default([], true) }}"
  run_once: true
  vars:
    plateforme_catalogue_brut: |
      {% for f in plateforme_fichiers.files | map(attribute='path') | sort %}
      {%   set nom = f | dirname | basename %}
      {%   set v = lookup('ansible.builtin.file', f) | from_yaml | default({}, true) %}
      {%   set comps = (v.composants | default([])) | map(attribute='nom') | list %}
      {%   set publics = (v.composants | default([])) | selectattr('public', 'defined') | selectattr('public') | list %}
      {%   set domaine = v.domaine | default('', true) or (nom ~ '.' ~ (app_ip | replace('.', '-')) ~ '.sslip.io') %}
      - nom: {{ nom | to_json }}
        composants: {{ comps | to_json }}
        redemarrables: {{ comps | to_json }}
        base: {{ ((v.base | default({})).active | default(false)) | bool | to_json }}
        nom_base: {{ ((v.base | default({})).nom_base | default('app')) | to_json }}
        url: {{ (('https://' if (https_actif | bool and v.domaine | default('', true)) else 'http://') ~ domaine ~ (v.sonde | default((publics | first | default({})).chemin | default('/'), true))) | to_json if publics else '""' }}
      {% endfor %}

# Ces valeurs viennent du dépôt et finissent dans des scripts exécutés en root (sauvegardes, pfe-runbook) et
# dans la configuration de Prometheus : tout est vérifié ici, avant le moindre usage.
- name: Catalogue valide (noms Kubernetes, base PostgreSQL, adresse web)
  ansible.builtin.assert:
    that:
      - item.nom is match('^[a-z][a-z0-9-]{1,30}[a-z0-9]$')
      - item.nom not in ['default', 'kube-system', 'kube-public', 'kube-node-lease', 'argocd', 'plateforme']
      - item.composants | length > 0
      - item.composants | reject('match', '^[a-z][a-z0-9-]{0,30}[a-z0-9]$') | list | length == 0
      - "'base' not in item.composants"
      - item.composants | unique | length == item.composants | length
      - item.nom_base is match('^[a-z_][a-z0-9_]{0,62}$')
      - item.url == '' or item.url is match('^https?://[a-z0-9.-]+(:[0-9]{1,5})?/[A-Za-z0-9/._~-]*$')
    fail_msg: "applications/{{ item.nom }}/values.yaml : nom, composants, base.nom_base ou adresse invalide ({{ item }})"
    quiet: true
  loop: "{{ plateforme_catalogue }}"
  loop_control:
    label: "{{ item.nom }}"
  run_once: true
