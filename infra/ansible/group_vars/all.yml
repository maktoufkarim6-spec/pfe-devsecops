# =====================================================================================================
# APPLICATION SUPERVISÉE : seul bloc à adapter pour réutiliser la plateforme avec une autre application
# (voir docs/REUTILISER.md). Les serveurs se déclarent dans inventory.ini.
# =====================================================================================================
app_name: app-cobaye               # nom court (titres, journaux)
app_namespace: default             # espace de noms Kubernetes de l'application
app_api: server                    # déploiement ET conteneur de l'API : CPU et RAM surveillés par l'IA,
                                   # redémarrage progressif par l'agent en cas de surcharge
app_restartable: [server, client]  # déploiements que l'agent a le droit de redémarrer progressivement
app_db_deployment: postgres        # déploiement PostgreSQL sauvegardé chaque nuit ("" = pas de base)
app_db_name: demo                  # base à sauvegarder (pg_dump), restaurée chaque semaine pour test
app_ci_heavy_container: sonarqube  # conteneur lourd de la CI que l'agent peut arrêter hors build ("" = aucun)
app_url_path: /                    # page de l'application testée par la page d'accueil
repo_web: https://github.com/maktoufkarim6-spec/pfe-devsecops   # dépôt (liens de la page d'accueil)
evaluation_url: https://claude.ai/artifact/MYtKLPBoj4eNnS1GNgYaaU   # résultats de la campagne ("" = aucun)
jenkins_job: pipeline-app-cobaye         # job Jenkins du pipeline (bouton « Déployer » de la page d'accueil)
# =====================================================================================================

# Connexion SSH par clé (cles-ssh.yml, lancé par deploy.sh --cles puis --fermer-mots-de-passe)
cle_parc: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/pfe_parc"                 # clé d'Ansible
cles_admin_fichier: "{{ lookup('ansible.builtin.env', 'HOME') }}/.pfe-secrets/cles-admin.pub"   # clés des PC
fermer_mots_de_passe: false
dossier_ssh: "~{{ ansible_user }}/.ssh"                       # où poser les clés sur chaque serveur
ansible_ssh_private_key_file: "{{ cle_parc }}"

# Serveur de supervision (seule adresse autorisée à lire les collecteurs des nœuds)
monitoring_ip: "{{ hostvars[groups['monitoring'][0]].ansible_host }}"

# Images (versions figées ; cAdvisor « latest » requis pour le stockage containerd de Docker récent)
image_node_exporter: quay.io/prometheus/node-exporter:v1.8.2
image_cadvisor: gcr.io/cadvisor/cadvisor:latest
image_cadvisor_k3s: gcr.io/cadvisor/cadvisor:v0.49.1
image_prometheus: prom/prometheus:v2.53.0
image_alertmanager: prom/alertmanager:v0.27.0
image_grafana: grafana/grafana:11.6.0

# Ports des collecteurs sur chaque nœud (réseau de l'hôte, filtrés par le pare-feu)
port_node_exporter: 9100
port_cadvisor: 8081
port_cadvisor_k3s: 8082

# Plages autorisées en plus du serveur de supervision : local, réseaux Docker, pods k3s
exporters_allowed_extra: ["127.0.0.0/8", "172.16.0.0/12", "10.42.0.0/16"]

# Dossier où Jenkins (ou un opérateur) annonce une maintenance (lu par node-exporter)
textfile_dir: /var/lib/node_exporter/textfile

# Supervision
monitoring_dir: /opt/pfe-monitoring
repo_url: "{{ repo_web }}.git"
repo_dir: /opt/pfe-devsecops
prometheus_retention: 15d
aiops_version: "3.1.0"

# Alertes par e-mail (Gmail). Vide : alertes visibles dans Alertmanager et Grafana seulement.
# Le mot de passe d'application n'est jamais écrit ici : variable d'environnement PFE_SMTP_PASSWORD.
alert_email_to: ""
alert_email_from: ""
smtp_smarthost: smtp.gmail.com:587
smtp_password: "{{ lookup('ansible.builtin.env', 'PFE_SMTP_PASSWORD') }}"

# Agent de remédiation (voir remediation-agent/README.md)
remediation_version: "1.0.0"
# conseil : l'agent simule et journalise ce qu'il ferait ; actif : il exécute. Passer en actif après
# avoir relu son journal (docker exec mon-remediation python -m agent journal) puis relancer deploy.sh.
remediation_mode: conseil
# Nettoyage disque automatique (images Docker inutilisées, journaux > 14 j) : désactivé tant que le
# propriétaire n'a pas donné son accord explicite (règle du projet : rien n'est supprimé sans accord).
remediation_disk_cleanup: false
remediation_max_actions_per_hour: 3
remediation_cooldown_minutes: 30

# Sauvegardes croisées : chaque nœud copie ses jeux sur son pair (supervision <-> premier nœud applicatif)
backup_root: /var/backups/pfe
backup_peer: "{{ k3s_server_host if inventory_hostname in groups['monitoring'] else groups['monitoring'][0] }}"
backup_time: "02:30"            # sauvegarde + copie
backup_check_time: "04:30"      # vérification des jeux reçus, test de restauration hebdomadaire
backup_keep_daily: 7
backup_keep_weekly: 4
backup_min_free_gb: 3           # en dessous, la sauvegarde est annulée (et une alerte part)

# Page d'accueil : services testés en continu (blackbox-exporter). lien = adresse à ouvrir dans le navigateur.
# Nœud de contrôle k3s (k3s_server=true dans l'inventaire ; à défaut, le premier nœud applicatif)
k3s_server: false
k3s_server_host: >-
  {{ (groups['nodes'] | map('extract', hostvars) | selectattr('k3s_server', 'in', [true, 'true', 'True'])
      | map(attribute='inventory_hostname') | list + groups['nodes']) | first }}
app_ip: "{{ hostvars[k3s_server_host].ansible_host }}"
# Page Jenkins « Lancer un build » : connexion Jenkins demandée, puis un clic sur « Build »
jenkins_job_url: "http://{{ app_ip }}:8080/job/{{ jenkins_job }}/build?delay=0sec"
image_blackbox: prom/blackbox-exporter:v0.25.0
services_web:
  - { nom: "Application", url: "http://{{ app_ip }}{{ app_url_path }}", lien: "http://{{ app_ip }}{{ app_url_path }}" }
  - { nom: "Jenkins", url: "http://{{ app_ip }}:8080/login", lien: "http://{{ app_ip }}:8080/" }
  - { nom: "Argo CD", url: "https://{{ app_ip }}:32252/", lien: "https://{{ app_ip }}:32252/" }
  - { nom: "SonarQube", url: "http://{{ app_ip }}:9000/api/system/status", lien: "http://{{ app_ip }}:9000/", hors_build: true }
  - { nom: "Vault", url: "http://{{ app_ip }}:8200/v1/sys/health", lien: "http://{{ app_ip }}:8200/ui/" }
  - { nom: "Grafana", url: "http://mon-grafana:3000/api/health", lien: "http://{{ monitoring_ip }}:3000/" }
  - { nom: "Prometheus", url: "http://mon-prometheus:9090/-/healthy", lien: "" }
  - { nom: "Alertmanager", url: "http://mon-alertmanager:9093/-/healthy", lien: "" }
  - { nom: "Moteur AIOps", url: "http://mon-aiops-engine:8000/metrics", lien: "" }
  - { nom: "Agent de remédiation", url: "http://mon-remediation:9095/healthz", lien: "" }
# Les autres services exposés (ports Docker publics, NodePort et Ingress de k3s) sont découverts
# automatiquement : au déploiement, puis chaque minute par l'agent. Adresses déjà déclarées ci-dessus :
services_declares: >-
  {{ (services_web | map(attribute='url') | map('urlsplit', 'netloc') | list)
     + (services_web | map(attribute='lien') | select | map('urlsplit', 'netloc') | list)
     + (services_web | map(attribute='url') | list) + (services_web | map(attribute='lien') | select | list) }}
