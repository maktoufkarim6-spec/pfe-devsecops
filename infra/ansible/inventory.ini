# Parc supervisé. Ajouter un nœud = une ligne dans [nodes], puis relancer ../deploy.sh
#   node_name : nom du nœud dans Prometheus, Grafana et le moteur AIOps (minuscules, chiffres, tirets)
#   node_app  : true si le nœud héberge l'application k3s (variables applicatives surveillées)

[monitoring]
supervision ansible_host=54.37.13.100 ansible_connection=local node_name=monitoring node_app=false

[nodes]
app-1 ansible_host=57.129.142.176 node_name=app-1 node_app=true

[all:vars]
ansible_user=debian
