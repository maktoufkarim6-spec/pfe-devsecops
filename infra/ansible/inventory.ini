# Parc supervisé. Ajouter un nœud = une ligne dans [nodes], puis relancer ../deploy.sh
#   node_name : nom du nœud dans Prometheus, Grafana et le moteur AIOps (minuscules, chiffres, tirets)
#   node_app  : true si le nœud héberge l'application k3s (variables applicatives surveillées)
#   k3s_server: true sur le SEUL nœud de contrôle du cluster k3s (là où kubectl fonctionne) : redémarrages
#               de l'API par l'agent et sauvegarde de la base passent par lui. Jenkins, SonarQube et Argo CD
#               y tournent aussi. Un nœud ajouté au cluster (agent k3s) garde k3s_server=false.

[monitoring]
supervision ansible_host=54.37.13.100 ansible_connection=local node_name=monitoring node_app=false

[nodes]
app-1 ansible_host=57.129.142.176 node_name=app-1 node_app=true k3s_server=true
# Exemple de nœud supplémentaire (agent k3s qui a rejoint le cluster, voir docs/REUTILISER.md) :
# app-2 ansible_host=<IP> node_name=app-2 node_app=true

[all:vars]
ansible_user=debian
