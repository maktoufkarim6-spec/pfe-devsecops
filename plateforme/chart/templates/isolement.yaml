# Isolement de l'application : plafond de ressources et réseau fermé par défaut.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: plafond
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  hard:
    limits.cpu: {{ .Values.quotas.cpu | quote }}
    limits.memory: {{ .Values.quotas.memoire | quote }}
    pods: {{ .Values.quotas.pods | quote }}
    persistentvolumeclaims: "2"
    services.nodeports: "0"         # aucun port ouvert directement sur les nœuds
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limites-par-defaut
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
---
# Rien n'entre, sauf : les pods de la même application, et Traefik (kube-system) vers les composants publics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refus-par-defaut
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
{{- $publics := list }}
{{- range .Values.composants }}{{ if .public }}{{ $publics = append $publics .nom }}{{ end }}{{ end }}
{{- if $publics }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entree-web
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: {{ toJson $publics }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
{{- if include "app.https" . }}
---
# Validation Let's Encrypt : Traefik doit joindre le petit serveur temporaire de cert-manager (http01)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: validation-certificat
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
